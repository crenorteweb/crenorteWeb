<app-header></app-header>

<div class="container-fluid py-4 px-3 px-md-4">

  <!-- Cabeçalho da página -->
  <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
    <div>
      <h2 class="mb-0">Módulo de Produção</h2>
      <small class="text-muted">Acompanhamento da produção diária por colaborador</small>
    </div>
    <img src="../../../assets/img/logo2-crenorte.png" alt="Logo CRENORTE" class="producao-logo" />
  </div>

  <!-- Filtros -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">

      <!-- Seleção de cargo -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          <i class="bi bi-briefcase me-1 text-success"></i>Cargo
        </label>
        <app-filtro-cargo (cargoSelecionado)="onCargo($event)"></app-filtro-cargo>
      </div>

      <div class="row g-3 align-items-end">

        <!-- Colaborador (oculto no modo Geral) -->
        <div class="col-12 col-md-6" *ngIf="cargo() !== 'geral'">
          <label class="form-label fw-semibold">
            <i class="bi bi-person me-1 text-success"></i>Colaborador
          </label>
          <app-filtro-colaborador
            [cargo]="cargo()"
            (colaboradorSelecionado)="onColaborador($event)"
          ></app-filtro-colaborador>
        </div>

        <!-- Data -->
        <div class="col-12 col-md-4">
          <label class="form-label fw-semibold">
            <i class="bi bi-calendar3 me-1 text-success"></i>Data
          </label>
          <app-filtro-data (dataSelecionada)="onData($event)"></app-filtro-data>
        </div>

      </div>
    </div>
  </div>

  <!-- Alerta de erro -->
  <div *ngIf="erro()" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ erro() }}
    <button type="button" class="btn-close" (click)="erro.set(null)" aria-label="Fechar"></button>
  </div>

  <!-- Spinner de carregamento -->
  <div *ngIf="carregando()" class="text-center py-5">
    <div class="spinner-border text-success" style="width:3rem;height:3rem;" role="status"></div>
    <p class="mt-3 text-muted">Buscando dados de produção...</p>
  </div>

  <!-- Conteúdo após carregar -->
  <ng-container *ngIf="!carregando() && jaCarregou()">

    <!-- Cards de resumo (usa registrosPorOrigem — reflete filtro de origem, não a busca por CPF) -->
    <app-cards-resumo
      [registros]="registrosPorOrigem()"
      [cargo]="cargo()"
    ></app-cards-resumo>

    <!-- Estado vazio -->
    <div *ngIf="registrosOriginais().length === 0" class="text-center py-5">
      <i class="bi bi-inbox fs-1 text-muted"></i>
      <p class="mt-3 text-muted fs-5 mb-1">Nenhum registro encontrado para este dia.</p>
      <small class="text-muted">Tente selecionar outra data ou verifique o colaborador selecionado.</small>
    </div>

    <!-- Tabela -->
    <div *ngIf="registrosOriginais().length > 0" class="card shadow-sm">

      <div class="card-header bg-white py-3">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
          <span class="fw-semibold text-success">
            <i class="bi bi-table me-2"></i>{{ nomeColaborador }}
          </span>
          <div class="d-flex align-items-center gap-3 flex-wrap">
            <app-busca-cpf
              [total]="registrosOriginais().length"
              [filtrado]="registrosFiltrados().length"
              (termoBusca)="onTermoBusca($event)"
            ></app-busca-cpf>
            <app-botoes-exportacao
              [registros]="registrosFiltrados()"
              [cargo]="cargo()"
              [nomeColaborador]="nomeColaborador"
              [data]="data()"
            ></app-botoes-exportacao>
          </div>
        </div>

        <!-- Filtros de resultado e origem -->
        <div class="d-flex align-items-center gap-3 flex-wrap">

        <!-- Filtro de resultado -->
        <div class="d-flex gap-2 flex-wrap">
          <button
            type="button"
            [class]="filtroResultado() === 'todos'
              ? 'btn btn-success btn-sm'
              : 'btn btn-outline-secondary btn-sm'"
            (click)="filtroResultado.set('todos')"
          >
            Todos <span class="badge bg-white text-dark ms-1">{{ registrosPorOrigem().length }}</span>
          </button>
          <button
            type="button"
            [class]="filtroResultado() === 'apto'
              ? 'btn btn-success btn-sm'
              : 'btn btn-outline-success btn-sm'"
            (click)="filtroResultado.set('apto')"
          >
            Aptos <span class="badge ms-1" [class.bg-white]="filtroResultado() === 'apto'" [class.text-dark]="filtroResultado() === 'apto'" [class.bg-success]="filtroResultado() !== 'apto'" >{{ contarResultado('apto') }}</span>
          </button>
          <button
            type="button"
            [class]="filtroResultado() === 'inapto'
              ? 'btn btn-danger btn-sm'
              : 'btn btn-outline-danger btn-sm'"
            (click)="filtroResultado.set('inapto')"
          >
            Inaptos <span class="badge ms-1" [class.bg-white]="filtroResultado() === 'inapto'" [class.text-dark]="filtroResultado() === 'inapto'" [class.bg-danger]="filtroResultado() !== 'inapto'">{{ contarResultado('inapto') }}</span>
          </button>
          <button
            *ngIf="mostrarFiltroNaoAnalisado"
            type="button"
            [class]="filtroResultado() === 'nao_analisado'
              ? 'btn btn-warning btn-sm'
              : 'btn btn-outline-warning btn-sm'"
            (click)="filtroResultado.set('nao_analisado')"
          >
            Não analisados <span class="badge ms-1" [class.bg-white]="filtroResultado() === 'nao_analisado'" [class.text-dark]="true" [class.bg-warning]="filtroResultado() !== 'nao_analisado'">{{ contarResultado('nao_analisado') }}</span>
          </button>
        </div>

        <!-- Filtro de analista (somente no modo geral) -->
        <div *ngIf="cargo() === 'geral' && analistasDisponiveis().length > 0" class="d-flex align-items-center gap-2">
          <label class="form-label mb-0 small fw-semibold text-muted text-nowrap">
            <i class="bi bi-person-check me-1"></i>Analista
          </label>
          <select
            class="form-select form-select-sm"
            style="min-width: 180px"
            [ngModel]="filtroAnalista()"
            (ngModelChange)="filtroAnalista.set($event)"
          >
            <option value="">Todos</option>
            <option *ngFor="let a of analistasDisponiveis()" [value]="a.id">{{ a.nome }}</option>
          </select>
        </div>

        <!-- Filtro de município -->
        <div *ngIf="municipiosDisponiveis().length > 0" class="d-flex align-items-center gap-2">
          <label class="form-label mb-0 small fw-semibold text-muted text-nowrap">
            <i class="bi bi-building me-1"></i>Município
          </label>
          <select
            class="form-select form-select-sm"
            style="min-width: 170px"
            [ngModel]="filtroMunicipio()"
            (ngModelChange)="onFiltroMunicipio($event)"
          >
            <option value="">Todos</option>
            <option *ngFor="let m of municipiosDisponiveis()" [value]="m">{{ m }}</option>
          </select>
        </div>

        <!-- Filtro de bairro -->
        <div *ngIf="bairrosDisponiveis().length > 0" class="d-flex align-items-center gap-2">
          <label class="form-label mb-0 small fw-semibold text-muted text-nowrap">
            <i class="bi bi-map me-1"></i>Bairro
          </label>
          <select
            class="form-select form-select-sm"
            style="min-width: 160px"
            [ngModel]="filtroBairro()"
            (ngModelChange)="filtroBairro.set($event)"
          >
            <option value="">Todos</option>
            <option *ngFor="let b of bairrosDisponiveis()" [value]="b">{{ b }}</option>
          </select>
        </div>

        <!-- Filtro de origem -->
        <div *ngIf="origensDisponiveis().length > 0" class="d-flex align-items-center gap-2">
          <label class="form-label mb-0 small fw-semibold text-muted text-nowrap">
            <i class="bi bi-geo-alt me-1"></i>Origem
          </label>
          <select
            class="form-select form-select-sm"
            style="min-width: 160px"
            [ngModel]="filtroOrigem()"
            (ngModelChange)="filtroOrigem.set($event)"
          >
            <option value="">Todas</option>
            <option *ngFor="let o of origensDisponiveis()" [value]="o">{{ o }}</option>
          </select>
        </div>

        </div><!-- /filtros -->

      </div>

      <div class="card-body p-0">
        <app-tabela-producao
          [registros]="registrosFiltrados()"
          [cargo]="cargo()"
          (clienteClicado)="abrirModal($event)"
        ></app-tabela-producao>
      </div>

    </div>

  </ng-container>

</div>

<!-- Modal de detalhes do cliente -->
<app-modal-detalhe-cliente
  *ngIf="clienteSelecionado()"
  [preCadastro]="clienteSelecionado()"
  (fechar)="fecharModal()"
></app-modal-detalhe-cliente>
