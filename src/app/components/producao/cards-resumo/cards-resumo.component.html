<div *ngIf="registros.length > 0" class="row g-3 mb-4">

  <!-- Assessor -->
  <ng-container *ngIf="cargo === 'assessor'">
    <div class="col-12 col-sm-5 col-md-4">
      <div class="card border-0 shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-circle bg-success bg-opacity-10 p-3">
            <i class="bi bi-person-check fs-4 text-success"></i>
          </div>
          <div>
            <div class="text-muted small">Pré-cadastros no Dia</div>
            <div class="fw-bold fs-2 text-success">{{ total }}</div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Analista -->
  <ng-container *ngIf="cargo === 'analista'">
    <div class="col-12 col-sm-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-circle bg-secondary bg-opacity-10 p-3">
            <i class="bi bi-clipboard2-check fs-4 text-secondary"></i>
          </div>
          <div>
            <div class="text-muted small">Total Analisados</div>
            <div class="fw-bold fs-2 text-secondary">{{ total }}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-circle bg-success bg-opacity-10 p-3">
            <i class="bi bi-check-circle fs-4 text-success"></i>
          </div>
          <div>
            <div class="text-muted small">Aptos</div>
            <div class="fw-bold fs-2 text-success">{{ aptos }}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-circle bg-danger bg-opacity-10 p-3">
            <i class="bi bi-x-circle fs-4 text-danger"></i>
          </div>
          <div>
            <div class="text-muted small">Inaptos</div>
            <div class="fw-bold fs-2 text-danger">{{ inaptos }}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-circle bg-warning bg-opacity-10 p-3">
            <i class="bi bi-star-fill fs-4 text-warning"></i>
          </div>
          <div>
            <div class="text-muted small">Elegíveis</div>
            <div class="fw-bold fs-2 text-warning">{{ elegiveis }}</div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Geral -->
  <ng-container *ngIf="cargo === 'geral'">
    <div class="col-12 col-sm-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-circle bg-secondary bg-opacity-10 p-3">
            <i class="bi bi-clipboard2-check fs-4 text-secondary"></i>
          </div>
          <div>
            <div class="text-muted small">Total Analisados</div>
            <div class="fw-bold fs-2 text-secondary">{{ total }}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-circle bg-success bg-opacity-10 p-3">
            <i class="bi bi-check-circle fs-4 text-success"></i>
          </div>
          <div>
            <div class="text-muted small">Aptos</div>
            <div class="fw-bold fs-2 text-success">{{ aptos }}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-circle bg-danger bg-opacity-10 p-3">
            <i class="bi bi-x-circle fs-4 text-danger"></i>
          </div>
          <div>
            <div class="text-muted small">Inaptos</div>
            <div class="fw-bold fs-2 text-danger">{{ inaptos }}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-circle bg-warning bg-opacity-10 p-3">
            <i class="bi bi-star-fill fs-4 text-warning"></i>
          </div>
          <div>
            <div class="text-muted small">Elegíveis</div>
            <div class="fw-bold fs-2 text-warning">{{ elegiveis }}</div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Supervisor -->
  <ng-container *ngIf="cargo === 'supervisor'">
    <div class="col-12 col-sm-5 col-md-4">
      <div class="card border-0 shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-circle bg-success bg-opacity-10 p-3">
            <i class="bi bi-people fs-4 text-success"></i>
          </div>
          <div>
            <div class="text-muted small">Total Encaminhados no Dia</div>
            <div class="fw-bold fs-2 text-success">{{ total }}</div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

</div>
