<div>
  <div *ngIf="carregando()" class="form-control d-flex align-items-center gap-2" style="min-height:38px">
    <span class="spinner-border spinner-border-sm text-success" role="status"></span>
    <span class="text-muted small">Carregando...</span>
  </div>

  <div *ngIf="erro() && !carregando()" class="text-danger small mt-1">
    <i class="bi bi-exclamation-circle me-1"></i>{{ erro() }}
  </div>

  <select
    *ngIf="!carregando()"
    class="form-select"
    [ngModel]="uidSelecionado"
    (ngModelChange)="onChange($event)"
    [disabled]="!cargo || lista().length === 0"
  >
    <option value="">
      {{
        !cargo ? '— Selecione o cargo primeiro —'
        : lista().length === 0 ? '— Nenhum colaborador encontrado —'
        : '— Selecione o colaborador —'
      }}
    </option>
    <option *ngFor="let c of lista()" [value]="c.uid || c.id">{{ c.nome }}</option>
  </select>
</div>
