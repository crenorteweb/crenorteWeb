<div *ngIf="modoCaixaAssessor && clientesCaixa.length > 0">
  <button
    type="button"
    class="btn btn-success btn-sm"
    (click)="exportarExcelCaixaAssessor()"
    title="Exportar lista de clientes do assessor em Excel"
  >
    <i class="bi bi-file-earmark-spreadsheet me-1"></i>Exportar Excel
  </button>
</div>

<div *ngIf="modoEncaminhados && totalEncaminhados > 0" class="d-flex gap-2 flex-wrap">
  <button
    type="button"
    class="btn btn-outline-danger btn-sm"
    (click)="exportarPDFEncaminhados()"
    title="Exportar PDF dos encaminhamentos"
  >
    <i class="bi bi-file-earmark-pdf me-1"></i>PDF
  </button>
</div>

<div *ngIf="!modoEncaminhados && registrosGeral.length > 0" class="d-flex gap-2 flex-wrap mb-1">
  <button
    type="button"
    class="btn btn-outline-danger btn-sm"
    (click)="exportarPDFProducaoGeralPorDia()"
    title="Relatório de produção de todos os analistas por dia"
  >
    <i class="bi bi-file-earmark-bar-graph me-1"></i>PDF Produção Analistas
  </button>
</div>

<div *ngIf="!modoEncaminhados && registros.length > 0" class="d-flex gap-2 flex-wrap">
  <button
    type="button"
    class="btn btn-outline-danger btn-sm"
    (click)="exportarPDF()"
    title="Exportar PDF"
  >
    <i class="bi bi-file-earmark-pdf me-1"></i>PDF
  </button>
  <button
    type="button"
    class="btn btn-outline-success btn-sm"
    (click)="exportarExcel()"
    title="Exportar Excel"
  >
    <i class="bi bi-file-earmark-spreadsheet me-1"></i>Excel
  </button>

  <ng-container *ngIf="mostrarBotoesAptos">
    <button
      type="button"
      class="btn btn-danger btn-sm"
      (click)="exportarPDFAptos()"
      title="Exportar PDF somente dos aptos"
    >
      <i class="bi bi-file-earmark-pdf me-1"></i>PDF (Aptos)
    </button>
    <button
      type="button"
      class="btn btn-success btn-sm"
      (click)="exportarExcelAptos()"
      title="Exportar Excel somente dos aptos"
    >
      <i class="bi bi-file-earmark-spreadsheet me-1"></i>Excel (Aptos)
    </button>
  </ng-container>

  <button
    *ngIf="mostrarBotaoElegiveis"
    type="button"
    class="btn btn-outline-success btn-sm"
    (click)="exportarExcelElegiveis()"
    title="Exportar Excel somente dos CPFs elegíveis"
  >
    <i class="bi bi-file-earmark-spreadsheet me-1"></i>Excel (Elegíveis)
  </button>
</div>
