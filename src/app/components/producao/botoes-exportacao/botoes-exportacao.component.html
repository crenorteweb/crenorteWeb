<div *ngIf="registros.length > 0" class="d-flex gap-2 flex-wrap">
  <button
    type="button"
    class="btn btn-outline-danger btn-sm"
    (click)="exportarPDF()"
    title="Exportar PDF"
  >
    <i class="bi bi-file-earmark-pdf me-1"></i>PDF
  </button>
  <button
    type="button"
    class="btn btn-outline-success btn-sm"
    (click)="exportarExcel()"
    title="Exportar Excel"
  >
    <i class="bi bi-file-earmark-spreadsheet me-1"></i>Excel
  </button>

  <ng-container *ngIf="mostrarBotoesAptos">
    <button
      type="button"
      class="btn btn-danger btn-sm"
      (click)="exportarPDFAptos()"
      title="Exportar PDF somente dos aptos"
    >
      <i class="bi bi-file-earmark-pdf me-1"></i>PDF (Aptos)
    </button>
    <button
      type="button"
      class="btn btn-success btn-sm"
      (click)="exportarExcelAptos()"
      title="Exportar Excel somente dos aptos"
    >
      <i class="bi bi-file-earmark-spreadsheet me-1"></i>Excel (Aptos)
    </button>
  </ng-container>
</div>
