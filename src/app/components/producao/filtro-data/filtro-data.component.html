<div class="d-flex gap-2 align-items-center flex-wrap">
  <div class="input-group">
    <span class="input-group-text small text-muted">De</span>
    <input
      type="date"
      class="form-control"
      [(ngModel)]="dataInicio"
      (ngModelChange)="onInicioChange()"
    />
  </div>
  <div class="input-group">
    <span class="input-group-text small text-muted">Até</span>
    <input
      type="date"
      class="form-control"
      [(ngModel)]="dataFim"
      [min]="dataInicio"
      (ngModelChange)="onFimChange()"
    />
  </div>
</div>
